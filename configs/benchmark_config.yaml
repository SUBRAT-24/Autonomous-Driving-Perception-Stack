# ============================================================
# Benchmark Configuration — ONNX & TensorRT
# ============================================================

# Models to benchmark
models:
  yolo:
    pytorch_weights: "runs/detect/bdd100k_yolov8m/weights/best.pt"
    onnx_path: "weights/yolov8m_bdd100k.onnx"
    trt_path: "weights/yolov8m_bdd100k.engine"
    input_shape: [1, 3, 640, 640]
  
  midas:
    pytorch_model: "MiDaS_small"
    onnx_path: "weights/midas_small.onnx"
    trt_path: "weights/midas_small.engine"
    input_shape: [1, 3, 256, 256]

# ONNX export settings
onnx:
  opset_version: 17
  dynamic_axes: false          # Static shapes for TensorRT optimization
  simplify: true               # Run onnx-simplifier

# TensorRT build settings
tensorrt:
  precision: "fp16"            # "fp32", "fp16", or "int8"
  workspace_gb: 4              # Max workspace memory in GB
  min_timing_iterations: 3     # Minimum timing iterations for kernel selection
  avg_timing_iterations: 5     # Average timing iterations
  # INT8 calibration (only if precision = "int8")
  int8_calibration_images: 500
  int8_calibration_cache: "weights/int8_calibration.cache"

# Benchmark settings
benchmark:
  warmup_iterations: 50        # Warmup before timing
  benchmark_iterations: 200    # Iterations to average
  batch_sizes: [1]             # Batch sizes to test (1 for real-time)
  
  # Accuracy validation
  validation_images: 100       # Images to check output parity
  mAP_tolerance: 0.02          # Acceptable mAP drop after optimization

# Output
output_dir: "docs/results/benchmark"
